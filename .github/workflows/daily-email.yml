name: Daily Commercial Summary

on:
  schedule:
    - cron: '43 8 * * *'  # 05:43 BRT (UTC-3) — adiantado para compensar atraso médio de ~3h do GitHub Actions e mirar entrega por volta das 09h BRT
  workflow_dispatch:         # allows manual runs for testing
    inputs:
      yesterday_override:
        description: 'Date to use as "yesterday" (YYYY-MM-DD). Leave blank for actual yesterday.'
        required: false
        default: ''

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Send daily summary email
        run: node daily-email.js
        working-directory: scripts
        env:
          ANTHROPIC_KEY:       ${{ secrets.ANTHROPIC_KEY }}
          SENDGRID_API_KEY:    ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
          EMAIL_RECIPIENTS:    ${{ secrets.EMAIL_RECIPIENTS }}
          YESTERDAY_OVERRIDE:  ${{ github.event.inputs.yesterday_override }}
